---
- name: Setup developer workstation
  hosts: workstation
  gather_facts: true

  pre_tasks:
    - name: Validate workstation target
      ansible.builtin.import_role:
        name: checkhost
      vars:
        checkhost_target: workstation
      tags: [ always, checkhost ]

  roles:
    - role: software
      tags: [ workstation, software ]

    - role: folders
      tags: [ workstation, folders ]

    - role: dotfiles
      tags: [ workstation, dotfiles ]

    - role: desktop
      tags: [ workstation, desktop ]

    - role: display
      tags: [ workstation, display ]

    - role: optimize
      tags: [ workstation, optimize ]

    - role: mise
      tags: [ workstation, mise ]

    - role: platformio
      tags: [ workstation, platformio ]

    - role: android_dev
      tags: [ workstation, android_dev ]

    - role: docker
      tags: [ workstation, docker ]

    - role: virtualization_host
      tags: [ workstation, virtualization_host ]

    - role: tmux
      tags: [ workstation, tmux ]
