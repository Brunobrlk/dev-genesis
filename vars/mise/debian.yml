---
mise_install:
  - name: mise-prerequisites
    method: common/package
    packages:
      - curl
      - gpg

  - name: mise-apt-repository
    method: debian/apt_repository
    repo:
      key_url: https://mise.jdx.dev/gpg-key.pub
      keyring: /etc/apt/keyrings/mise-archive-keyring.gpg
      line: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.gpg] https://mise.jdx.dev/deb stable main"

  - name: mise
    method: debian/apt
    package: mise
