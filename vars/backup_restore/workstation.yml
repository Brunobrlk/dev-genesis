---
items:
  - name: development
    local: "{{ ansible_user_dir }}/Development/"
    backup: "{{ backup_catalog_root }}/Development/"
    backup_rsync_options:
      - --copy-links
      - --exclude=build/
      - --exclude=.gradle/
      - --exclude=node_modules/
      - --exclude=.idea/
      - --exclude=.dart_tool/
      - --exclude=.venv/
      - --exclude=venv/
      - --exclude=ephemeral/
      - --exclude=.plugin_symlinks/
      - --exclude=__pycache__/

  - name: documents
    local: "{{ ansible_user_dir }}/Documents/"
    backup: "{{ backup_catalog_root }}/Documents/"

  - name: downloads
    local: "{{ ansible_user_dir }}/Downloads/"
    backup: "{{ backup_catalog_root }}/Downloads/"

  - name: music
    local: "{{ ansible_user_dir }}/Music/"
    backup: "{{ backup_catalog_root }}/Music/"

  - name: pictures
    local: "{{ ansible_user_dir }}/Pictures/"
    backup: "{{ backup_catalog_root }}/Pictures/"

  - name: videos
    local: "{{ ansible_user_dir }}/Videos/"
    backup: "{{ backup_catalog_root }}/Videos/"

  - name: local-share-secure
    local: "{{ ansible_user_dir }}/.local/share/private/"
    backup: "{{ backup_catalog_root }}/.local/share/private/"
    mode: "0700"
