---
items:
  - name: secure-local-share
    local: "{{ ansible_user_dir }}/.local/share/secure/"
    backup: "{{ backup_restore_source_path }}/home/.local/share/secure/"
    mode: "0700"

  - name: ssh
    local: "{{ ansible_user_dir }}/.ssh/"
    backup: "{{ backup_restore_source_path }}/home/.ssh/"
    mode: "0700"

  - name: gnupg
    local: "{{ ansible_user_dir }}/.gnupg/"
    backup: "{{ backup_restore_source_path }}/home/.gnupg/"
    mode: "0700"

  - name: bash-config
    local: "{{ ansible_user_dir }}/.config/bash/"
    backup: "{{ backup_restore_source_path }}/home/.config/bash/"

  - name: development-projects
    local: "{{ ansible_user_dir }}/Development/projects/"
    backup: "{{ backup_restore_source_path }}/Development/projects/"
    rsync_options:
      - --exclude=build/
      - --exclude=.gradle/
      - --exclude=node_modules/
      - --exclude=.idea/
      - --exclude=.dart_tool/
      - --exclude=.venv/
      - --exclude=__pycache__/

  - name: videos
    enabled: false
    local: "{{ ansible_user_dir }}/Videos/"
    backup: "{{ backup_restore_source_path }}/media/Videos/"

  - name: music
    enabled: false
    local: "{{ ansible_user_dir }}/Music/"
    backup: "{{ backup_restore_source_path }}/media/Music/"

  - name: pictures
    enabled: false
    local: "{{ ansible_user_dir }}/Pictures/"
    backup: "{{ backup_restore_source_path }}/media/Pictures/"
