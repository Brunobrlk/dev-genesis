---
machine_profile: workstation

target_distro: fedora
desktop_environment: kde
display_server: wayland
dotfiles_profile: modern

confirm_workstation_setup: true
confirm_dotfiles_setup: true
confirm_backup: false
confirm_restore: false
confirm_nvidia_setup: false

dotfiles_repo_url: "https://github.com/Brunobrlk/dotfiles.git"

external_drive_mount: "/run/media/{{ ansible_user_id }}/Bruno"
backup_destination_root: "{{ external_drive_mount }}/Backups"
backup_date: "{{ ansible_date_time.date }}"
restore_backup_date: ""
detected_machine_name: >-
  {{
    (
      ansible_facts.product_name
      | default(ansible_facts.hostname, true)
    )
    | lower
    | regex_replace('[ _]+', '-')
    | regex_replace('[^a-z0-9-]+', '-')
    | regex_replace('-+', '-')
    | regex_replace('^-+', '')
    | regex_replace('-+$', '')
  }}
backup_restore_root: "{{ backup_destination_root }}/workstation/{{ detected_machine_name }}/{{ backup_date }}/home"
