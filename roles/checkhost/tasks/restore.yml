---
- name: Validate common workstation values
  ansible.builtin.import_tasks: common_workstation.yml

- name: Validate restore confirmation and core paths
  ansible.builtin.assert:
    that:
      - confirm_restore is defined
      - confirm_restore | bool
      - backup_destination_root is defined
      - backup_destination_root is string
      - backup_destination_root | length > 0
      - backup_destination_root.startswith('/')
    fail_msg: >-
      Refusing to run restore. Set confirm_restore=true and configure
      an absolute backup_destination_root.
