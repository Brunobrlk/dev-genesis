---
- name: Validate common workstation values
  ansible.builtin.import_tasks: common_workstation.yml

- name: Validate dotfiles setup configuration
  ansible.builtin.assert:
    that:
      - dotfiles_profile is defined
      - dotfiles_profile is string
      - dotfiles_profile | length > 0
      - dotfiles_repo_url is defined
      - dotfiles_repo_url is string
      - dotfiles_repo_url | length > 0
      - confirm_dotfiles_setup is defined
      - confirm_dotfiles_setup | bool
    fail_msg: >-
      Refusing to run dotfiles setup. Configure dotfiles_profile,
      dotfiles_repo_url, and confirm_dotfiles_setup=true.
