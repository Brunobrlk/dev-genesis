---
- name: Validate common workstation values
  ansible.builtin.import_tasks: common_workstation.yml

- name: Validate workstation setup confirmation
  ansible.builtin.assert:
    that:
      - confirm_workstation_setup is defined
      - confirm_workstation_setup | bool
    fail_msg: "Refusing to run workstation setup. Set confirm_workstation_setup=true."
