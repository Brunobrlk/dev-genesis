---
- name: Validate common workstation values
  ansible.builtin.import_tasks: common_workstation.yml

- name: Validate backup configuration
  ansible.builtin.assert:
    that:
      - backup_restore_root is defined
      - backup_restore_root is string
      - backup_restore_root | length > 0
      - confirm_backup is defined
      - confirm_backup | bool
    fail_msg: >-
      Refusing to run backup. Configure backup_restore_root and confirm_backup=true.

- name: Check backup destination root
  ansible.builtin.stat:
    path: "{{ backup_restore_root }}"
  register: backup_destination_stat

- name: Validate backup destination root
  ansible.builtin.assert:
    that:
      - backup_destination_stat.stat.exists
      - backup_destination_stat.stat.isdir
    fail_msg: "Backup destination root does not exist: {{ backup_restore_root }}"
