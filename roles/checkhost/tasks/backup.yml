---
- name: Validate common workstation values
  ansible.builtin.import_tasks: common_workstation.yml

- name: Validate backup confirmation and core paths
  ansible.builtin.assert:
    that:
      - confirm_backup is defined
      - confirm_backup | bool
      - external_drive_mount is defined
      - external_drive_mount is string
      - external_drive_mount | length > 0
      - backup_destination_root is defined
      - backup_destination_root is string
      - backup_destination_root | length > 0
      - backup_destination_root.startswith('/')
    fail_msg: >-
      Refusing to run backup. Set confirm_backup=true and configure
      external_drive_mount plus an absolute backup_destination_root.
