---
- name: Enable tuned service
  become: true
  ansible.builtin.systemd_service:
    name: tuned
    enabled: true
    state: started

- name: Read active tuned profile
  become: true
  ansible.builtin.command:
    argv:
      - tuned-adm
      - active
  register: virtualization_host_tuned_active
  changed_when: false
  failed_when: false

- name: Apply tuned virtualization host profile
  become: true
  ansible.builtin.command:
    argv:
      - tuned-adm
      - profile
      - "{{ virtualization_host_tuned_profile }}"
  when: virtualization_host_tuned_profile not in virtualization_host_tuned_active.stdout
  changed_when: true
