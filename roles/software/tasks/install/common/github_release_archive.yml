---
- name: Resolve GitHub release archive asset for {{ software_label }}
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/install/common/resolve_github_release_asset.yml"

- name: Ensure destination exists for {{ software_label }}
  ansible.builtin.file:
    path: "{{ software_item.destination }}"
    state: directory
    mode: "0755"

- name: Download GitHub release archive for {{ software_label }}
  ansible.builtin.get_url:
    url: "{{ github_release_download_url }}"
    dest: "/tmp/{{ github_release_asset_name }}"
    mode: "0644"

- name: Extract GitHub release archive for {{ software_label }}
  ansible.builtin.unarchive:
    src: "/tmp/{{ github_release_asset_name }}"
    dest: "{{ software_item.destination }}"
    remote_src: true

- name: Refresh font cache for {{ software_label }}
  ansible.builtin.command: fc-cache -fv
  changed_when: false
  when: software_item.update_font_cache | default(false) | bool
