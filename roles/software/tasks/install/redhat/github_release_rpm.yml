---
- name: Check installed RPM version for {{ software_label }}
  ansible.builtin.command:
    cmd: "rpm -q --qf '%{VERSION}' {{ software_item.package }}"
  register: github_rpm_installed_version
  changed_when: false
  failed_when: false

- name: Resolve installed RPM version for {{ software_label }}
  ansible.builtin.set_fact:
    github_rpm_installed_version_value: >-
      {{
        github_rpm_installed_version.stdout
        if github_rpm_installed_version.rc == 0
        else 'none'
      }}

- name: Resolve GitHub release RPM asset for {{ software_label }}
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/install/common/resolve_github_release_asset.yml"

- name: Install or upgrade {{ software_label }} from GitHub release RPM
  become: true
  ansible.builtin.dnf:
    name: "{{ github_release_download_url }}"
    state: present
    disable_gpg_check: "{{ not (software_item.gpg_check | default(true)) }}"
  when: github_rpm_installed_version_value != github_release_latest_version_value
