---
- name: Ensure dnf plugins are installed for COPR
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: true

- name: Enable COPR repository for {{ software_label }}
  community.general.copr:
    name: "{{ software_item.copr }}"
    state: enabled
  become: true

- name: Install {{ software_label }} from COPR
  ansible.builtin.dnf:
    name: "{{ software_item.package | default(software_item.packages) }}"
    state: present
  become: true
