---
- name: Add PPA for {{ software_label }}
  ansible.builtin.apt_repository:
    repo: "{{ software_item.ppa }}"
    state: present
    update_cache: true
  become: true

- name: Install {{ software_label }} from PPA
  ansible.builtin.apt:
    name: "{{ software_item.package | default(software_item.packages) }}"
    state: present
    update_cache: true
  become: true
