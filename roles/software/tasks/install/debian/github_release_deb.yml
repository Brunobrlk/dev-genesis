---
- name: Check installed DEB version for {{ software_label }}
  ansible.builtin.command:
    cmd: "dpkg-query -W -f='${Version}' {{ software_item.package }}"
  register: github_deb_installed_version
  changed_when: false
  failed_when: false

- name: Resolve installed DEB version for {{ software_label }}
  ansible.builtin.set_fact:
    github_deb_installed_version_value: >-
      {{
        github_deb_installed_version.stdout
        if github_deb_installed_version.rc == 0
        else 'none'
      }}

- name: Resolve GitHub release DEB asset for {{ software_label }}
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/install/common/resolve_github_release_asset.yml"

- name: Install or upgrade {{ software_label }} from GitHub release DEB
  become: true
  ansible.builtin.apt:
    deb: "{{ github_release_download_url }}"
    state: present
  when: github_deb_installed_version_value != github_release_latest_version_value
