---
- name: Add apt repository key for {{ software_label }}
  ansible.builtin.apt_key:
    url: "{{ software_item.repo.key_url }}"
    state: present
  become: true
  when: software_item.repo.key_url is defined

- name: Add apt repository for {{ software_label }}
  ansible.builtin.apt_repository:
    repo: "{{ software_item.repo.line }}"
    filename: "{{ software_item.repo.filename | default(omit) }}"
    state: present
    update_cache: true
  become: true

- name: Install {{ software_label }} from apt repository
  ansible.builtin.apt:
    name: "{{ software_item.package | default(software_item.packages) }}"
    state: present
    update_cache: true
  become: true
