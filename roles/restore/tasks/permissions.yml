---
- name: Detect whether .ssh was restored in this run
  ansible.builtin.set_fact:
    restore_has_ssh: >-
      {{
        (restore_items_to_process | default([]))
        | selectattr('local', 'equalto', ansible_user_dir ~ '/.ssh/')
        | list
        | length > 0
      }}

- name: Check restored .ssh directory
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.ssh"
  register: restore_ssh_stat
  when: restore_has_ssh

- name: Find restored .ssh subdirectories
  ansible.builtin.find:
    paths: "{{ ansible_user_dir }}/.ssh"
    file_type: directory
    recurse: true
  register: restore_ssh_directories
  when:
    - restore_has_ssh
    - restore_ssh_stat.stat.exists

- name: Find restored .ssh files
  ansible.builtin.find:
    paths: "{{ ansible_user_dir }}/.ssh"
    file_type: file
    recurse: true
  register: restore_ssh_files
  when:
    - restore_has_ssh
    - restore_ssh_stat.stat.exists

- name: Tighten restored .ssh directory permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0700"
  loop: "{{ restore_ssh_directories.files | default([]) + ([{'path': ansible_user_dir ~ '/.ssh'}] if restore_ssh_stat.stat.exists else []) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - restore_has_ssh
    - restore_ssh_stat.stat.exists

- name: Tighten restored .ssh file permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: >-
      {{
        '0644'
        if (item.path | basename).endswith('.pub')
        else '0600'
      }}
  loop: "{{ restore_ssh_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - restore_has_ssh
    - restore_ssh_stat.stat.exists

