---
- name: Check Android SDK package markers
  ansible.builtin.stat:
    path: "{{ android_sdk_marker_path }}"
  register: android_sdk_package_markers
  loop: "{{ android_sdk_packages }}"
  loop_control:
    label: "{{ item }}"
  vars:
    android_sdk_marker_path: >-
      {{
        android_sdk_root ~ '/platform-tools/adb'
        if item == 'platform-tools'
        else android_sdk_root ~ '/emulator/source.properties'
        if item == 'emulator'
        else android_sdk_root ~ '/build-tools/' ~ (item | regex_replace('^build-tools;', ''))
        if item is match('^build-tools;')
        else android_sdk_root ~ '/platforms/' ~ (item | regex_replace('^platforms;', ''))
        if item is match('^platforms;')
        else android_sdk_root ~ '/sources/' ~ (item | regex_replace('^sources;', ''))
      }}
  changed_when: false

- name: Install Android SDK packages
  ansible.builtin.command:
    argv:
      - "{{ android_sdkmanager_path }}"
      - "--sdk_root={{ android_sdk_root }}"
      - "{{ item }}"
  loop: "{{ android_sdk_packages }}"
  loop_control:
    label: "{{ item }}"
    index_var: android_sdk_package_index
  when: not android_sdk_package_markers.results[android_sdk_package_index].stat.exists
  changed_when: true
