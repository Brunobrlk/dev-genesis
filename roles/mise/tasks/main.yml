---
- name: Assert mise role supports Linux
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - target_distro is defined
      - target_distro is string
      - target_distro | length > 0
    fail_msg: "The mise role requires Linux and a valid target_distro."

- name: Load mise distro variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vars/mise/{{ target_distro }}.yml"

- name: Install mise through software role
  ansible.builtin.include_role:
    name: software
    tasks_from: api_install_many
  vars:
    software_items: "{{ mise_install }}"

- name: Resolve mise executable
  ansible.builtin.shell: command -v mise
  args:
    executable: /bin/bash
  environment: "{{ mise_environment }}"
  register: mise_executable_command
  changed_when: false
  failed_when: mise_executable_command.rc != 0

- name: Set mise executable path
  ansible.builtin.set_fact:
    mise_executable: "{{ mise_executable_command.stdout }}"

- name: Configure mise for bash
  ansible.builtin.include_tasks: bash.yml
  when: mise_configure_bash | bool

- name: Install mise tools from config
  ansible.builtin.include_tasks: install_tools.yml
  when: mise_install_config_tools | bool

- name: Export mise environment for later roles
  ansible.builtin.set_fact:
    mise_environment:
      PATH: "{{ mise_ansible_path }}"
