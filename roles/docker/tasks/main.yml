---
- name: Assert Docker role supports Linux
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - target_distro is defined
      - target_distro is string
      - target_distro | length > 0
    fail_msg: "The Docker role requires Linux and a valid target_distro."

- name: Install Docker for target distro
  ansible.builtin.include_tasks: "{{ target_distro }}.yml"

- name: Apply Docker post-install configuration
  ansible.builtin.import_tasks: post_install.yml
