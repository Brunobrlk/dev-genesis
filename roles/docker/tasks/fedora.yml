---
- name: Gather installed package facts on Fedora
  ansible.builtin.package_facts:
    manager: auto

- name: Resolve installed conflicting Docker packages on Fedora
  ansible.builtin.set_fact:
    docker_fedora_installed_conflicting_packages: >-
      {{
        docker_fedora_conflicting_packages
        | select('in', ansible_facts.packages.keys() | list)
        | list
      }}

- name: Remove installed conflicting Docker packages on Fedora
  become: true
  ansible.builtin.dnf:
    name: "{{ docker_fedora_installed_conflicting_packages }}"
    state: absent
  when: docker_fedora_installed_conflicting_packages | length > 0

- name: Install DNF plugin dependency for Docker repository
  become: true
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Add Docker Fedora GPG key
  become: true
  ansible.builtin.rpm_key:
    key: "{{ docker_fedora_gpg_key }}"
    state: present

- name: Add Docker Fedora repository
  become: true
  ansible.builtin.get_url:
    url: "{{ docker_fedora_repo_url }}"
    dest: "{{ docker_fedora_repo_dest }}"
    owner: root
    group: root
    mode: "0644"

- name: Install Docker Engine packages on Fedora
  become: true
  ansible.builtin.dnf:
    name: "{{ docker_fedora_packages }}"
    state: present
    update_cache: true
