---
- name: Load workstation folder variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vars/folders/workstation.yml"

- name: Create workstation directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ workstation_directories }}"
  loop_control:
    label: "{{ item.path }}"
